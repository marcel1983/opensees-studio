[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opensees-studio"
dynamic = ["version"]
description = "A modern, SAP2000-style desktop GUI for OpenSeesPy."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ozan" }]
keywords = ["opensees", "openseespy", "structural", "earthquake", "fem", "gui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    # ── Headless base (core + services, no Qt required) ──────────────────────
    "pydantic>=2.5",
    "numpy>=1.26",
    "h5py>=3.10",
    # Reading a bar layout out of a DXF drawing (File → Import). Pure Python,
    # headless, MIT — it belongs to the base tier like the rest of core/services.
    "ezdxf>=1.3",
]

[project.optional-dependencies]
# ── The solver ─────────────────────────────────────────────────────────────
# OpenSeesPy is a separate program with its own license (free for research,
# education and internal use; commercial redistribution needs a license from
# its authors), so it is not a base dependency: the application models, exports
# and reports without it, and analyses need it (Options → Solver can also point
# to another installation). See docs/adr/ADR-0003-solver-engines.md.
#   pip install -e ".[opensees]"
opensees = [
    "openseespy==3.8.0.0",
    "openseespywin==3.8.0.0 ; sys_platform == 'win32'",
    # The scalable stability check diagnoses the sparse stiffness matrix with
    # SciPy. The desktop extra already needs SciPy for the PyNite engine.
    "scipy>=1.11",
]
# ── GUI / visualization stack (desktop app only) ──────────────────────────
# Install with: pip install -e ".[gui]"   (desktop)
#               pip install -e ".[gui,dev]"  (desktop + dev tools)
# Headless / web reuse: pip install -e .   (base only, no Qt pulled in)
gui = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.3",
    "pyqtgraph>=0.13",
    "imageio[ffmpeg]>=2.34",
    # File → Export → IFC (services/ifc_export.py); imported only when exporting.
    "ifcopenshell>=0.8.4",
    # The bundled second engine (ADR-0003): linear static and P-Delta of
    # elastic frames, MIT. Pinned: services/pynite_runner.py maps its result
    # conventions onto OpenSees' and is tested against them.
    "PyNiteFEA==3.2.0",
    # scipy is what the PyNite engine solves with; pandas is listed for
    # forward-compatibility and imported by no module (phantom dep since 2026-06-15).
    "scipy>=1.11",
    "pandas>=2.1",
]
dev = [
    # The test suites solve models: development always has the solver.
    "opensees-studio[opensees]",
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "hatch>=1.9",
    # Enforces the layering in CLAUDE.md; see [tool.importlinter].
    "import-linter>=2.15",
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1.29",
]
packaging = [
    # Freezes the desktop app into dist/OpenSeesStudio (see packaging/README.md).
    "pyinstaller>=6.16",
]

[project.scripts]
opensees-studio = "opensees_studio.__main__:main"

[project.urls]
Homepage = "https://github.com/ogunc/opensees-studio"
Issues = "https://github.com/ogunc/opensees-studio/issues"

[tool.hatch.version]
# Single source of truth: the same string the app reports in About.
path = "src/opensees_studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opensees_studio"]

# ─────────── Ruff ───────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    # Engineering notation (E, I, A, M, V, Kinit, cR1) is the domain language of this code.
    "N802", "N806", "N815",
]
# Engineering and unit notation that ruff would flag as look-alikes of ASCII letters:
# multiplication sign, Greek alpha, gamma, nu, rho.
allowed-confusables = ["×", "α", "γ", "ν", "ρ"]

[tool.ruff.format]
quote-style = "double"

# ─────────── Mypy ───────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["openseespy.*", "pyvista.*", "pyvistaqt.*", "vtk.*", "pyqtgraph.*", "Pynite.*"]
ignore_missing_imports = true

# ─────────── Import Linter ───────────
# The layering in CLAUDE.md, enforced instead of trusted. `views` may import
# anything below it, `core` nothing above it, and Qt/OpenSeesPy stay out of the
# packages that must work headless.
[tool.importlinter]
root_package = "opensees_studio"
# Forbidden-import contracts below name external packages (PySide6, openseespy),
# and import-linter only looks outside the root package when told to.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: views > commands > viewmodels > services > core"
type = "layers"
layers = [
    "opensees_studio.views",
    "opensees_studio.commands",
    "opensees_studio.viewmodels",
    "opensees_studio.services",
    "opensees_studio.core",
]

[[tool.importlinter.contracts]]
name = "core is headless: no Qt, no OpenSeesPy"
type = "forbidden"
source_modules = ["opensees_studio.core"]
forbidden_modules = [
    "PySide6",
    "PyQt5",
    "PyQt6",
    "PySide2",
    "openseespy",
    "openseespywin",
]

[[tool.importlinter.contracts]]
name = "services are Qt-free (except the one sanctioned worker bridge)"
type = "forbidden"
source_modules = ["opensees_studio.services"]
forbidden_modules = ["PySide6", "PyQt5", "PyQt6", "PySide2"]
# services/qt_workers.py exists to run an analysis on a QThread and is the only
# module allowed to import Qt; services/__init__.py must not pull it in, so the
# headless tier stays headless. import-linter reports the external module at its
# top level, hence `PySide6` rather than `PySide6.QtCore`.
ignore_imports = ["opensees_studio.services.qt_workers -> PySide6"]

[[tool.importlinter.contracts]]
name = "only services talk to OpenSees"
type = "forbidden"
source_modules = [
    "opensees_studio.core",
    "opensees_studio.views",
    "opensees_studio.viewmodels",
    "opensees_studio.commands",
]
forbidden_modules = ["openseespy", "openseespywin"]
# Direct imports only: viewmodels -> services -> openseespy is the sanctioned
# path, and the layers contract already pins the direction.
allow_indirect_imports = true

# ─────────── Pytest ───────────
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "gui: marks tests that require a Qt event loop",
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["src/opensees_studio"]
omit = ["src/opensees_studio/views/*"]  # GUI excluded from coverage targets
