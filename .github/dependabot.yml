version: 2
updates:
  # No pip ecosystem. pyproject.toml has only lower bounds, so Dependabot's pip
  # updates touched nothing but requirements-lock.txt, which CI never installs
  # from: a green run said nothing about the bumped versions. The lock file is a
  # record of an environment where all three suites passed (see CLAUDE.md) and
  # is regenerated by hand, not one package at a time.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
